name: Build ROM

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device to build'
        required: true
        default: 'a34x'
        type: string
      build_zip_mode:
        description: 'Build mode: -z (flashable zip + target-files) or -r (direct flashable zip)'
        required: true
        default: '-z'
        type: choice
        options:
          - '-z'
          - '-r'
  push:
    branches:
      - 'sembilan'
      - 'sixteen'
      - 'main'
  pull_request:
    branches:
      - 'sembilan'
      - 'sixteen'
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build A34 5G ROM
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a34x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang curl ffmpeg jq libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld p7zip-full protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          fi
          if [ -n "${{ secrets.PLATFORM_KEY_PEM }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM Flashable Zip
        run: ./scripts/make_rom.sh ${{ inputs.build_zip_mode || '-z' }}

      - name: Upload ROM to Gofile
        if: success()
        run: |
          echo "=== Locating Built ROM ==="
          ROM_FILE="$(find "$OUT_DIR" -maxdepth 1 -name "*.zip" ! -name "*target_files*" 2>/dev/null | head -n 1)"
          if [ -z "$ROM_FILE" ] || [ ! -f "$ROM_FILE" ]; then
            ROM_FILE="$(find "$OUT_DIR" -maxdepth 1 -name "*.zip" 2>/dev/null | head -n 1)"
          fi

          if [ -z "$ROM_FILE" ] || [ ! -f "$ROM_FILE" ]; then
            echo "::error::No built ROM zip found in $OUT_DIR"
            ls -la "$OUT_DIR" || true
            exit 1
          fi

          FILE_NAME="$(basename "$ROM_FILE")"
          FILE_SIZE="$(ls -lh "$ROM_FILE" | awk '{print $5}')"
          echo "Found ROM file: $FILE_NAME ($FILE_SIZE)"

          echo "=== Finding Best Gofile Server ==="
          SERVER_RES="$(curl -s --connect-timeout 15 --max-time 30 https://api.gofile.io/servers || true)"
          SERVER="$(echo "$SERVER_RES" | jq -r '.data.servers[0].name // empty')"
          if [ -z "$SERVER" ]; then
            SERVER_RES="$(curl -s --connect-timeout 15 --max-time 30 https://api.gofile.io/getServer || true)"
            SERVER="$(echo "$SERVER_RES" | jq -r '.data.server // empty')"
          fi

          if [ -n "$SERVER" ]; then
            UPLOAD_URL="https://${SERVER}.gofile.io/uploadFile"
          else
            UPLOAD_URL="https://upload.gofile.io/uploadfile"
          fi
          echo "Target Gofile upload URL: $UPLOAD_URL"

          echo "=== Uploading ROM to Gofile ==="
          UPLOAD_TOKEN="${{ secrets.GOFILE_TOKEN }}"
          AUTH_PARAM=()
          if [ -n "$UPLOAD_TOKEN" ]; then
            AUTH_PARAM=(-F "token=$UPLOAD_TOKEN")
          fi

          UPLOAD_SUCCESS=false
          UPLOAD_RES=""
          for ATTEMPT in 1 2 3; do
            echo "Upload attempt $ATTEMPT..."
            UPLOAD_RES="$(curl --progress-bar "${AUTH_PARAM[@]}" -F "file=@$ROM_FILE" "$UPLOAD_URL" || true)"
            STATUS="$(echo "$UPLOAD_RES" | jq -r '.status // empty')"
            if [ "$STATUS" = "ok" ]; then
              UPLOAD_SUCCESS=true
              break
            else
              echo "Attempt $ATTEMPT failed or returned unexpected response: $UPLOAD_RES"
              sleep 5
            fi
          done

          if [ "$UPLOAD_SUCCESS" != "true" ]; then
            echo "::error::Failed to upload ROM to Gofile. Response: $UPLOAD_RES"
            exit 1
          fi

          DOWNLOAD_PAGE="$(echo "$UPLOAD_RES" | jq -r '.data.downloadPage // empty')"

          echo "=== Gofile Upload Success ==="
          echo "Download URL: $DOWNLOAD_PAGE"
          echo "::notice title=Gofile ROM Download Link::$DOWNLOAD_PAGE"

          {
            echo "## 📱 Galaxy A34 5G (Ported S23 Ultra Base) Build"
            echo ""
            echo "✅ **ROM Build completed and uploaded successfully!**"
            echo ""
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| **Device** | Samsung Galaxy A34 5G (\`a34x\`) |"
            echo "| **Port Base** | Samsung Galaxy S23 Ultra (\`dm3q\` / \`SM-S918B\`) |"
            echo "| **Filename** | \`$FILE_NAME\` |"
            echo "| **Size** | $FILE_SIZE |"
            echo "| **Download Link** | [**Download from Gofile**]($DOWNLOAD_PAGE) |"
            echo ""
            echo "> [!TIP]"
            echo "> This ZIP is flashable directly via TWRP or OrangeFox custom recovery."
          } >> "$GITHUB_STEP_SUMMARY"
